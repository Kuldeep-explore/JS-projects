<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo App</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>

  <div class="container">
    <h1>Todo App</h1>

    <!-- Input section -->
    <div class="input-section">
      <input 
        type="text" 
        id="todo-input" 
        placeholder="Enter a task..." 
        aria-label="New todo task input"
        autocomplete="off"
      />
      <button id="add-btn" aria-label="Add new todo task">Add</button>
    </div>

    <!-- Empty state message -->
    <div id="empty-state" class="empty-state">
      <p>No tasks yet. Add one to get started! 🎯</p>
    </div>

    <!-- Todo list -->
    <ul id="todo-list" role="list"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
