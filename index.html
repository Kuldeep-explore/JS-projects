<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <h1>Todo App</h1>

    <!-- Input section -->
    <div class="input-section">
      <input type="text" id="todo-input" placeholder="Enter a task..." />
      <button id="add-btn">Add</button>
    </div>

    <!-- Todo list -->
    <ul id="todo-list"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
